stack:
  - javascript
  - golang

workflows:
  - id: default
    on: [precommit, prepush]
    steps:
      # Internal tools
      # docs/api/ is `deno doc --html` output, regenerated wholesale by
      # `deno task cli docs`. Linting it means every regeneration re-breaks the
      # gate and has to be re-fixed by hand -- which is exactly what the
      # previously committed, newline-fixed generated files show happened.
      #
      # third-party/ holds in-tree forks that keep upstream's bytes as they are
      # (third-party/jsonschema/FORK.md).
      - validate-eof:
          exclude: ["docs/api/", "third-party/"]
      - validate-trailing-whitespace:
          exclude: ["docs/api/", "third-party/"]
      - validate-bom:
          exclude: ["docs/api/", "third-party/"]
      - validate-line-endings:
          exclude: ["docs/api/", "third-party/"]
      - validate-large-files:
          maxKb: 1024
          exclude: ["docs/api/"]
      - validate-case-conflict
      - validate-merge-conflict
      - validate-json:
          exclude:
            - ".eser/recipes/"
            - "tsconfig.json"
      - validate-toml
      - validate-yaml:
          allowMultipleDocuments: true
      - validate-symlinks
      - validate-shebangs
      - validate-secrets:
          allowMissingCredentials: true
          exclude:
            # Agent skill definitions whose security rules teach by
            # counter-example -- the "secrets" they contain are the hardcoded
            # credentials the docs tell you never to write. .claude is a
            # symlink to .agents (see AGENTS.md).
            - ".claude/skills/"
            - ".agents/skills/"
      - validate-filenames:
          rules:
            - directory: "cmd/"
              convention: "snake_case"
              exclude:
                - "Makefile"
                - "README.md"
            - directory: "pkg/ajan/"
              convention: "snake_case"
              exclude:
                - "Makefile"
                - "README.md"
            - directory: "pkg/@eserstack/ajan/"
              convention: "snake_case"
              exclude:
                - "Dockerfile"
                - "Makefile"
                - "README.md"
            - directory: "*"
              convention: "kebab-case"
              exclude:
                # SKILL.md is a fixed filename required by the agent-skills
                # convention, so the tree cannot satisfy kebab-case (.claude is
                # a symlink to .agents).
                - ".claude/"
                - ".agents/"
                # Backlog.md names task files "task-1 - Title.md" by design.
                - "backlog/"
                - ".github/"
                - ".git/COMMIT_EDITMSG"
                - "AGENTS.md"
                - "CHANGELOG.md"
                - "Makefile"
                - "PHILOSOPHY.md"
                - "VERSION"
                - "cmd/"
                - "pkg/ajan/"
                - "pkg/@eserstack/ajan/"
                - "docs/"
                - "etc/coverage/"
                - "etc/temp/"
                - ".eser/recipes/"
                - "Dockerfile"
                - "LICENSE"
                - "README.md"
                - "TODOS.md"
                - "WIRING.md"
                - "pkg/@eserstack/noskills/README-HOW.md"
                # In-tree fork that keeps upstream's file names
                # (third-party/jsonschema/FORK.md).
                - "third-party/"
      - validate-submodules
      - validate-licenses:
          exclude:
            - ".eser/recipes/"
            # Upstream's own Apache-2.0 headers stay as they are.
            - "third-party/"
      - validate-runtime-js-apis:
          exclude:
            - "pkg/@eserstack/standards/cross-runtime/"
            # The Deno-to-Node codemods are Node scripts (process, node:fs);
            # they go in M1-T37 (TASK-231).
            - "etc/codemods/"
            - "etc/scripts/hybrid-sniffer.ts"
            # Bootstrap: generates the package manifests, so it runs before the
            # package graph exists and cannot import from it.
            - "etc/scripts/gen-jsr-manifests.ts"
            # Release tooling: runs from a fresh checkout after publish and must
            # not depend on the workspace it just released (Deno-only scripts).
            - "etc/scripts/preflight-npm-consumer.ts"
            # Run on a bare node with built-ins only, so they cannot import the
            # cross-runtime layer: a Claude Code hook, the skill validator and
            # the release-notes CI step.
            - ".agents/hooks/decision-nudge.js"
            - ".agents/skills/eser-rules-manager/scripts/validate-skills.ts"
            - "etc/scripts/release-notes-from-changelog.ts"
            # Tests and benches run only under Deno — exempt from the portable-API rule.
            - ".test.ts"
      - validate-self-imports:
          exclude:
            # Tests are not part of the published module graph.
            - ".test.ts"
      # Namespace imports, `??` defaults and no `export *` re-exports
      # (javascript-practices). Existing
      # violations are listed in .eser/baselines/code-conventions.json; only
      # new ones fail. Shrink the baseline after migrating files with
      # `deno run -A ./pkg/@eserstack/codebase/validate-code-conventions.ts --write-baseline`.
      - validate-code-conventions
      # camelCase declared names and TODO(TASK-<number>) comments, which oxlint
      # does not check (decision-21, decision-34).
      - validate-naming-and-todos:
          exclude:
            - ".eser/recipes/"
      - validate-server-loc:
          directory: "pkg/ajan/noskillsserverfx"
      - validate-error-coverage:
          file: "pkg/ajan/noskillsserverfx/errors.go"
          errorObjects:
            - NSError

      # Regenerate the per-package JSR publish manifests.
      #
      # pkg/@eserstack/*/deno.json is derived from each package's package.json
      # plus the root VERSION file (and deno.extra.json where a package needs
      # `publish.include` or `tasks`, which package.json cannot express). They
      # are gitignored: keeping them checked in duplicated every exports map in
      # two places, which is what made a one-line version bump rewrite ~70
      # files and had already drifted once.
      - shell:
          name: gen-jsr-manifests
          command: deno run -A ./etc/scripts/gen-jsr-manifests.ts
          timeout: 60

      # The Deno-to-Node codemods run under Node and have their own tests
      # (M0-T18, M0-T19); the folder goes in M1-T37.
      - shell:
          name: codemod-tests
          command: node --test etc/codemods
          timeout: 120

      # Build the native FFI library before any Deno step that loads it.
      #
      # ~20 TS packages reach Go through pkg/@eserstack/ajan's c-shared library.
      # Without this step the *.ffi.test.ts suites fail with "native library
      # unavailable" on a clean checkout, and CI otherwise type-checks and tests
      # the whole TS half against whatever binary was last *published* -- so an
      # ABI change cannot fail the build that introduces it.
      #
      # GOWORK=off: the artifact must resolve from pkg/@eserstack/ajan/go.mod
      # alone, not the repo-root workspace (see go.work).
      - shell:
          name: build-native-lib
          # The WASM profile too: the WASM loader tests load it, and the check
          # fails a profile over its size limits or with a forbidden package.
          command: make ajan-lib ajan-wasm-check
          timeout: 300

      # Workspace checks. They read the members from the root package.json
      # `workspaces` and fail when it lists none, so they run after the native
      # library they call is rebuilt and the manifests they compare exist.
      # No dependency cycles between packages:
      - validate-circular-deps
      # Export sub-paths are kebab-case:
      - validate-export-names
      # Each generated deno.json matches its package.json:
      - validate-package-configs

      # Deno checks
      - shell:
          name: deno-formatter
          command: deno fmt --check
          fixCommand: deno fmt
      - shell:
          name: deno-linter
          command: deno lint .
          fixCommand: deno lint --fix .
      # cli has no mod.ts, and its main.ts graph is what `deno compile` and
      # publish check in strict mode, so it is a root of its own.
      - shell:
          name: deno-type-check
          command: deno check ./pkg/@eserstack/*/mod.ts ./pkg/@eserstack/cli/main.ts
          timeout: 120
      - shell:
          name: deno-tests
          command: deno test --allow-sys --allow-net --allow-env --allow-read
            --allow-write --allow-run --allow-ffi --parallel --trace-leaks
            --coverage=./etc/coverage/
          timeout: 300
      - shell:
          name: deno-publish-check
          command: deno publish --dry-run --allow-dirty
          timeout: 120

      # Go checks.
      #
      # This repo is TWO Go modules: github.com/eser/stack (root) and
      # github.com/eser/ajan (pkg/@eserstack/ajan, the cgo/WASI FFI bridge).
      # `./...` never crosses a module boundary, so each module is checked in
      # its own directory -- otherwise the bridge (bridge.go + main*.go, ~5.9k
      # LOC) and its tests go completely unchecked, which was the case until
      # 2026-08.
      #
      # There is deliberately NO go.work. A workspace would let one command
      # cover both modules, but it also merges golangci-lint's dependency graph
      # into the bridge's, which produced an "ambiguous import" on
      # cloud.google.com/go/compute that needed a `replace` to paper over, and
      # forced GOWORK=off on release builds so shipped artifacts still resolved
      # from the bridge's own go.mod. Two `cd`s are cheaper than that.
      - shell:
          name: go-check
          command: "go vet ./... && go build ./... &&
            cd pkg/@eserstack/ajan && go vet ./... && go build ./..."
          timeout: 180
      # golangci-lint is declared in the ROOT module's `tool` block, so
      # `go tool golangci-lint` cannot resolve it from inside the bridge
      # module. Build it once from root, then run that binary in both.
      - shell:
          name: go-lint
          command: "go build -o etc/temp/golangci-lint
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint &&
            ./etc/temp/golangci-lint run ./... &&
            cd pkg/@eserstack/ajan && ../../../etc/temp/golangci-lint run ./..."
          fixCommand: "gofmt -w . && go build -o etc/temp/golangci-lint
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint &&
            ./etc/temp/golangci-lint run --fix ./... &&
            cd pkg/@eserstack/ajan && ../../../etc/temp/golangci-lint run --fix
            ./..."
          timeout: 300
      - shell:
          name: go-tests
          command: "go test -race ./... &&
            cd pkg/@eserstack/ajan && go test -race ./..."
          timeout: 420

  # Release preflight: every release-only step, run on main BEFORE a tag exists.
  #
  # Each entry here is a step that used to run only after the tag was pushed
  # and that failed at least one release in 2026 (wasip1 build, npm bundle
  # externals, generated manifests, publish dry-run, release tooling). A tag
  # is pushed onto a commit that already passed this, so the release run never
  # learns anything new. Kept under ten minutes on CI; heavier checks belong in
  # precommit or in the release run itself.
  - id: preflight
    on: [preflight]
    steps:
      - shell:
          name: gen-jsr-manifests
          command: deno run -A ./etc/scripts/gen-jsr-manifests.ts
          timeout: 60
      - shell:
          name: deno-publish-check
          command: deno publish --dry-run --allow-dirty
          timeout: 120
      - shell:
          name: npm-build-cli
          command: deno run --allow-all ./pkg/@eserstack/cli/scripts/npm-build.ts
          timeout: 180
      - shell:
          name: npm-build-noskills
          command: deno run --allow-all ./pkg/@eserstack/noskills/scripts/npm-build.ts
          timeout: 180
      - shell:
          name: npm-build-laroux
          command: deno run --allow-all ./pkg/@eserstack/laroux-server/scripts/npm-build.ts
          timeout: 180
      # Installs the packed CLI OUTSIDE the repo and runs the no-Deno smoke
      # commands; inside the monorepo, Node would resolve undeclared
      # dependencies from the workspace and hide them.
      - shell:
          name: npm-consumer-install
          command: deno run --allow-all ./etc/scripts/preflight-npm-consumer.ts
          timeout: 300
      # Native (this platform) plus both WASM modules; the c-shared build is
      # what compile-binaries ships, the wasip1 build is what broke v4.5.0.
      - shell:
          name: ajan-native-build
          command: make ajan-lib
          timeout: 300
      - shell:
          name: ajan-wasm-build
          command: make ajan-wasm-check
          timeout: 300
      - shell:
          name: homebrew-dry-run
          command: go run ./cmd/eser dev homebrew --dry-run
          timeout: 120
      - shell:
          name: nix-dry-run
          command: go run ./cmd/eser dev nix-hashes --dry-run
          timeout: 120
      # The release run's compile, for this host only, so a build that fails
      # stops here and not after publish (v4.5.2 died at compile time after
      # the registries were written).
      - shell:
          name: compile-current
          command: go run ./cmd/eser dev compile --current-only
          timeout: 600

  - id: commit-validation
    on: [commitmsg]
    steps:
      - validate-commit-msg:
          forceScope: true
          strict: true
          types:
            - ci
            - chore
            - docs
            - feat
            - fix
            - perf
            - refactor
            - revert
            - test

scripts:
  # Validation
  ok: eser workflows run -e precommit
  fix: eser workflows run -e precommit --fix
  # Everything the release run does that precommit does not; run before tagging.
  preflight: eser workflows run -e preflight

  # Setup
  init: pnpm install && eser codebase install

  # Testing
  test:
    command: deno test --allow-sys --allow-net --allow-env --allow-read
      --allow-write --allow-run --allow-ffi --parallel --trace-leaks
      --coverage=./etc/coverage/
    description: Run tests with coverage
  test-watch:
    command: deno test --allow-sys --allow-net --allow-env --allow-read
      --allow-write --allow-run --allow-ffi --parallel --watch
    description: Run tests in watch mode

  # Code quality
  lint: deno lint .
  fmt: deno fmt
  check: deno check ./pkg/@eserstack/*/mod.ts ./pkg/@eserstack/cli/main.ts

  # Build
  build: deno run --allow-all ./pkg/@eserstack/cli/scripts/npm-build.ts
  compile: go run ./cmd/eser dev compile

  # Documentation
  # Generates into docs/api/, NOT docs/. docs/ also holds hand-written content --
  # docs/adr/ and docs/schema/ -- and the previous `rm -rf ./docs/` deleted it.
  # pkg/@cool/ was also globbed here and does not exist.
  docs: "rm -rf ./docs/api/ && deno doc --name='eserstack' --output=./docs/api/
    --html ./pkg/@eserstack/*/mod.ts"
  # Lints every module a package publishes in its package.json exports, not
  # only mod.ts; CLI-first packages map "." to main.ts.
  docs-lint: "roots=$(deno run --allow-read ./etc/scripts/package-export-roots.ts)
    && deno doc --lint $roots"

  # Docker
  container-build: docker build -t eservm .
  container-run: docker run --interactive --tty --rm eservm

  # Maintenance
  clean: "rm -rf ./etc/coverage/* ./etc/coverage.lcov ./pnpm-lock.yaml && deno
    check ./pkg/@eserstack/*/mod.ts"

  # Coverage
  coverage: deno coverage ./etc/coverage/
  coverage-gen: deno coverage ./etc/coverage --lcov --output=./etc/coverage.lcov

  # Release
  # `release <patch|minor|major|same>` bumps, changelogs, commits, pushes, then
  # pushes the v<version> tag. The TAG PUSH is what triggers build.yml's release
  # run — CI never creates tags, because a tag pushed by its own GITHUB_TOKEN
  # dispatches nothing.
  release: eser codebase release
  rerelease: eser codebase rerelease
  unrelease: eser codebase unrelease
  version-bump: eser codebase versions
  # Escape hatch: tag by hand when a release commit already landed without one.
  tag: eser codebase gh release-tag
  release-notes: eser codebase gh release-notes
  changelog: eser codebase changelog-gen

  # Go shortcuts
  go-ok: make ok
  go-vuln: make vuln
  go-test: make test-coverage
  go-lint: make lint
  go-fmt: make fix
  go-build: make build
