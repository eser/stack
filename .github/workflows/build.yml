name: Integrity Pipeline

on:
  push:
    branches:
      - "**"
    # Releases are driven by the tag itself, not by a commit-message string.
    # branches and tags are OR'd, so this adds tag runs without narrowing the
    # branch runs. The tag must be pushed with a human's credentials: GitHub
    # deliberately does not dispatch workflows for refs pushed by a job using
    # GITHUB_TOKEN (the recursion guard), which is exactly why CI can no longer
    # create the tag for us.
    tags:
      - "v*"

  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  # Tag runs are never cancelled. Re-pushing a tag mid-release would otherwise
  # cancel the run somewhere between `publish` (irreversible — JSR and npm keep
  # the version forever) and `upload-assets`, leaving a released version with no
  # binaries attached.
  group: ${{ github.ref }}-integrity
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  # ── Always runs ─────────────────────────────────────────────────
  # Deliberately runs on tag pushes too. `release` pushes the commit and the tag
  # back to back, so the branch run and the tag run start almost together and the
  # tag run never waits on the branch one -- re-running validate here is what
  # makes the release verified by the same run that publishes it, rather than by
  # a separate run that may still be in flight (or already red).
  validate:
    name: Validate
    runs-on: ubicloud-standard-4-arm
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Run validation
        run: deno task cli ok

      - name: Generate coverage report
        run: deno coverage ./etc/coverage --lcov --output=./etc/coverage.lcov
        continue-on-error: true

      - name: Upload coverage
        if: hashFiles('etc/coverage.lcov') != ''
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./etc/coverage.lcov

  # ── Release: gate ───────────────────────────────────────────────
  # Preflight for everything downstream. It creates nothing (hence contents:
  # read) — its whole job is to fail BEFORE the irreversible steps run.
  #
  # No job output for the version: the `needs` context is not transitive, so
  # only direct dependents could read it anyway, and every consumer already
  # does VERSION=$(cat VERSION) against a checkout of the tag's tree — which
  # this gate has just proven equals the tag.
  release-gate:
    name: Release Gate
    needs: validate
    # event_name matters: workflow_dispatch lets you pick a tag from the
    # Run-workflow dropdown, which would otherwise re-run the entire release
    # chain against an already-published version with no tag push behind it.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify tag against tree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          FILE_VERSION="$(cat VERSION)"

          # The tag is what people install by; VERSION is what gets stamped into
          # every published package. If they disagree the release ships packages
          # under a version nobody can find from the tag.
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag $TAG says $VERSION but the VERSION file says $FILE_VERSION."
            echo "::error::Run 'deno task cli codebase release <patch|minor|major>' so tag and tree agree, then retag."
            exit 1
          fi

          # release-notes runs AFTER npm and JSR are written, so a missing
          # CHANGELOG section used to surface only once the registries were
          # irreversibly published — that is how the v4.3.0 release died.
          #
          # This pattern MIRRORS HEADING_PATTERN in
          # pkg/@eserstack/codebase/release-notes.ts, which is the parser that
          # actually runs later. Keep the two in step: a gate that accepts more
          # than the parser lets a release publish and then fail on notes (the
          # very failure this job exists to prevent), and one that accepts less
          # blocks a release the parser would have handled. In particular it is
          # ANCHORED AT BOTH ENDS — "## 4.3.0 - 2026-08-08 (hotfix)" is rejected
          # by the parser, so it must be rejected here too — and it tolerates the
          # optional "v" and brackets of the legacy headings still in the file
          # ("## [v4.1.61] - …", which changelog.go also still accepts).
          ESCAPED="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
          HEADING="^##[[:space:]]+\[?v?${ESCAPED}\]?[[:space:]]*-?[[:space:]]*([0-9]{4}-[0-9]{2}-[0-9]{2})?[[:space:]]*$"

          if ! grep -Eq "$HEADING" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section matching '## $VERSION - <date>'."
            echo "::error::Note the heading must end after the date — trailing text is not parsed."
            exit 1
          fi

          echo "### Releasing $TAG" >> $GITHUB_STEP_SUMMARY

  # ── Release: smoke test ─────────────────────────────────────────
  smoke-test:
    name: npm Smoke Test
    needs: release-gate
    runs-on: ubicloud-standard-4-arm
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eser npm package
        run: deno task cli build

      - name: Build noskills npm package
        run: deno run --allow-all pkg/@eserstack/noskills/scripts/npm-build.ts

      - name: Build laroux npm package
        run: deno run --allow-all pkg/@eserstack/laroux-server/scripts/npm-build.ts

      - name: Smoke test — eser help
        run: node pkg/@eserstack/cli/dist/eser.js --help

      - name: Smoke test — eser validate-licenses
        run: node pkg/@eserstack/cli/dist/eser.js codebase validate-licenses || true

      - name: Smoke test — noskills help
        run: node pkg/@eserstack/noskills/dist/noskills.js --help

      - name: Smoke test — laroux help
        run: node pkg/@eserstack/laroux-server/dist/laroux.js --help

      - name: Upload eser npm bundle
        uses: actions/upload-artifact@v7
        with:
          name: npm-eser
          path: pkg/@eserstack/cli/dist/

      - name: Upload noskills npm bundle
        uses: actions/upload-artifact@v7
        with:
          name: npm-noskills
          path: pkg/@eserstack/noskills/dist/

      - name: Upload laroux npm bundle
        uses: actions/upload-artifact@v7
        with:
          name: npm-laroux
          path: pkg/@eserstack/laroux-server/dist/

  # ── npm-only smoke test (no Deno) ──────────────────────────
  npm-no-deno-test:
    name: npm Install Test (no Deno)
    needs: smoke-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # No `cache: "pnpm"`: this job never checks out the repo -- it installs a
      # downloaded artifact -- and setup-node resolves the pnpm cache key from
      # pnpm-lock.yaml in the workspace, so it hard-fails with "Dependencies
      # lock file is not found" before any test runs.
      - name: Setup Node.js only
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Verify Deno is NOT installed
        run: |
          if command -v deno &>/dev/null; then
            echo "::error::Deno is installed — this job must run without Deno"
            exit 1
          fi
          echo "Confirmed: Deno is not installed"

      - name: Download eser npm bundle
        uses: actions/download-artifact@v8
        with:
          name: npm-eser
          path: npm-eser/

      # Installed as a dependency of a scratch project, not with `pnpm add -g`.
      #
      # What this job needs to prove is that the published package resolves,
      # declares its bin correctly, and runs under Node with no Deno present.
      # A global install tests all of that PLUS the runner's global-bin PATH
      # wiring, which is not ours and which broke this job twice: pnpm refuses
      # to link a global binary when its global bin directory is not already on
      # PATH, and `pnpm bin -g` cannot be used to discover that directory
      # because it exits non-zero in exactly that situation.
      #
      # A local install has no such coupling: pnpm links the bin into
      # node_modules/.bin, which is a fixed path we invoke directly.
      #
      # This job had never once executed before the tag-driven pipeline made it
      # a barrier in front of `publish` — so every bug in it was latent.
      - name: Install eser from artifact into a scratch consumer
        run: |
          set -euo pipefail
          mkdir -p consumer
          cd consumer
          printf '{"name":"consumer","private":true,"version":"1.0.0"}\n' > package.json
          pnpm add ../npm-eser/

          # Fixed location, exported once for the smoke tests below.
          echo "ESER_BIN=$PWD/node_modules/.bin/eser" >> "$GITHUB_ENV"

      - name: Smoke test — eser --help
        run: |
          "$ESER_BIN" --help

      - name: Smoke test — eser version
        run: |
          "$ESER_BIN" version

      - name: Smoke test — eser ajan version (graceful failure)
        run: |
          set +e
          OUTPUT=$("$ESER_BIN" ajan version 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "deno"; then
            echo "::error::Error message mentions Deno — npm package must not require Deno"
            exit 1
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "eser ajan version succeeded (unexpected but acceptable)"
          else
            echo "eser ajan version failed as expected (no shared library in npm package)"
            echo "Error output does NOT mention Deno — PASS"
          fi

  # ── Cross-runtime testing ──────────────────────────────────
  cross-runtime-test:
    name: Cross-Runtime Test (${{ matrix.runtime }} on ${{ matrix.os }})
    needs: validate
    # Skipped on tags: nothing in the release chain depends on this matrix, and
    # six more runners per tag is real cost. Note this is a cost trade, not a
    # guarantee -- the branch run covering this commit may still be running (or
    # failing) when the tag run publishes. `validate` is the gate that holds.
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.runtime != 'deno' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
        runtime: [deno, node, bun]
        include:
          - runtime: deno
            version: "2.9.5"
          - runtime: node
            version: "26"
          - runtime: bun
            version: "1.3"

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Build Go shared library (native)
        run: deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts

      - name: Verify FFI — eser ajan version
        env:
          ESER_AJAN_WASM: disabled
          ESER_AJAN_LIB_PATH: ${{ github.workspace }}/pkg/@eserstack/ajan/dist/${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}/libeser_ajan.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
        run: |
          if [ "${{ matrix.runtime }}" = "deno" ]; then
            deno task cli ajan version
          elif [ "${{ matrix.runtime }}" = "node" ]; then
            deno task cli build
            node pkg/@eserstack/cli/dist/eser.js ajan version
          elif [ "${{ matrix.runtime }}" = "bun" ]; then
            deno task cli build
            bun pkg/@eserstack/cli/dist/eser.js ajan version
          fi

      - name: Verify CLI — eser --help
        run: |
          if [ "${{ matrix.runtime }}" = "deno" ]; then
            deno task cli --help
          elif [ "${{ matrix.runtime }}" = "node" ]; then
            node pkg/@eserstack/cli/dist/eser.js --help
          elif [ "${{ matrix.runtime }}" = "bun" ]; then
            bun pkg/@eserstack/cli/dist/eser.js --help
          fi

  # ── Windows ─────────────────────────────────────────────────────
  # The only job that runs on Windows at all. Two things were unexercised
  # before it existed, both of which fail late and expensively:
  #
  #   1. pin_image_windows.go. Its cgo constructor pins the shared library so
  #      FreeLibrary can never unmap it -- the fix for the Go-runtime crash when
  #      a host dlclose/dlopens the image. It is compiled ONLY by
  #      publish-ajan.yml, which is workflow_dispatch-only, so a mistake there
  #      surfaced during a manual publish rather than on the PR that caused it.
  #   2. etc/scripts/install.ps1. Windows binaries have always been
  #      built and archived, but nothing ever unpacked that archive and checked
  #      the binaries land somewhere resolvable.
  #
  # Installing into a scratch directory and asserting Get-Command finds the
  # binaries is the whole point: "extracted" is not the property that matters --
  # "on PATH" is.
  windows-smoke:
    name: Windows Smoke Test
    # Skipped on tags for the same reason as cross-runtime-test: no release job
    # depends on it, and it is a cost trade rather than a guarantee -- a red
    # windows-smoke on the branch run does not block the tag run.
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      contents: read

    # Explicit rather than relying on the Windows runner default, so the
    # PowerShell in every step below is unambiguous.
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Build Windows binaries
        run: |
          New-Item -ItemType Directory -Path dist-windows -Force | Out-Null
          go build -o dist-windows/ ./cmd/noskills-server
          Get-ChildItem dist-windows

      # Compiles pin_image_windows.go for the first time outside a manual
      # publish. CGO_ENABLED=1 is required: the pin is a cgo constructor, and
      # with cgo off the file is dropped and the check becomes vacuous.
      - name: Build ajan shared library (compiles pin_image_windows.go)
        working-directory: pkg/@eserstack/ajan
        env:
          CGO_ENABLED: "1"
        run: go build -buildmode=c-shared -o eser_ajan.dll .

      - name: Verify the pin symbol is actually in the DLL
        working-directory: pkg/@eserstack/ajan
        run: |
          if (-not (Test-Path eser_ajan.dll)) { throw "eser_ajan.dll was not produced" }
          # A constructor that compiled but got stripped would leave the crash
          # unfixed while the build stayed green, so assert the symbol survived
          # into the artifact rather than trusting the exit code.
          $found = & go tool nm eser_ajan.dll 2>$null | Select-String 'eserAjanPinImage'
          if (-not $found) { throw "eserAjanPinImage not present in eser_ajan.dll" }
          Write-Host "pin constructor present: $found"

      - name: Run Go tests for the ajan module
        working-directory: pkg/@eserstack/ajan
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      # A release-shaped archive, for realism. Note this does NOT exercise the
      # installer's own name construction or its download and checksum path:
      # -ArchivePath deliberately bypasses both so the job tests the current tree
      # rather than whatever is already published. Those two remain covered only
      # by the first real release.
      - name: Package a release-shaped archive
        run: |
          Compress-Archive -Path dist-windows/* -DestinationPath noskills-server-v0.0.0-x86_64-pc-windows-msvc.zip -Force

      - name: Install via etc/scripts/install.ps1
        run: |
          ./etc/scripts/install.ps1 `
            -Product noskills-server `
            -ArchivePath noskills-server-v0.0.0-x86_64-pc-windows-msvc.zip `
            -InstallDir "$env:RUNNER_TEMP\eser-bin"

      - name: Assert the installed binaries resolve on PATH
        run: |
          # Re-read the stored user PATH the installer wrote. A fresh step gets a
          # new process whose $env:PATH is the value from when the job started,
          # so without this the assertion would test the installer's in-session
          # mutation rather than the persisted registry change it makes.
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('Path', 'User')

          foreach ($bin in @('noskills-server')) {
            $cmd = Get-Command $bin -ErrorAction SilentlyContinue

            if (-not $cmd) { throw "$bin did not resolve on PATH after install" }

            Write-Host "$bin -> $($cmd.Source)"
          }

  # ── Release: publish ────────────────────────────────────────────
  publish:
    name: Publish
    # npm-no-deno-test is a barrier, not just an ancestor: it used to be a leaf,
    # so a broken no-Deno install was only ever discovered AFTER npm already had
    # the version. Nothing reaches a registry until both smoke tests are green.
    needs: [release-gate, smoke-test, npm-no-deno-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pkg/@eserstack/*/deno.json are generated from each package's
      # package.json + the root VERSION file and are gitignored, so a fresh
      # checkout has none. Without this step `deno publish` finds no packages.
      - name: Generate JSR manifests
        run: deno run -A ./etc/scripts/gen-jsr-manifests.ts

      - name: Publish to JSR
        run: deno publish

      - name: Download eser npm bundle
        uses: actions/download-artifact@v8
        with:
          name: npm-eser
          path: npm-dist/eser/

      - name: Download noskills npm bundle
        uses: actions/download-artifact@v8
        with:
          name: npm-noskills
          path: npm-dist/noskills/

      - name: Download laroux npm bundle
        uses: actions/download-artifact@v8
        with:
          name: npm-laroux
          path: npm-dist/laroux/

      - name: Publish eser to npm
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: npm-dist/eser

      - name: Publish noskills to npm
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: npm-dist/noskills

      - name: Publish laroux to npm
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: npm-dist/laroux

      - name: Summary
        run: |
          VERSION=$(cat VERSION)
          echo "### Published v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **JSR:** https://jsr.io/@eser" >> $GITHUB_STEP_SUMMARY
          echo "- **npm (eser):** https://www.npmjs.com/package/eser/v/$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **npm (noskills):** https://www.npmjs.com/package/noskills/v/$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **npm (laroux):** https://www.npmjs.com/package/laroux/v/$VERSION" >> $GITHUB_STEP_SUMMARY

  # ── Release: sync release notes ────────────────────────────────
  release-notes:
    name: Sync Release Notes
    needs: publish
    runs-on: ubicloud-standard-2-arm

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync CHANGELOG to GitHub Release
        run: |
          VERSION=$(cat VERSION)
          deno task cli codebase gh release-notes --tag "v$VERSION" --create-if-missing
        env:
          GH_TOKEN: ${{ github.token }}

  # ── Release: build ajan native libs (macOS) ───────────────────
  build-ajan-darwin:
    name: Build ajan (darwin)
    needs: release-gate
    runs-on: macos-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: "pnpm"

      # build.ts imports @eserstack/standards (→ @std/path); under
      # nodeModulesDir:manual deno needs node_modules populated to resolve it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Build aarch64-darwin (native)
        run: deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts --target=aarch64-darwin

      - name: Build x86_64-darwin (cross-compile via clang -arch x86_64)
        run: deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts --target=x86_64-darwin

      - name: Upload darwin dist
        uses: actions/upload-artifact@v7
        with:
          name: ajan-dist-darwin
          path: |
            pkg/@eserstack/ajan/dist/aarch64-darwin/
            pkg/@eserstack/ajan/dist/x86_64-darwin/

  # ── Release: compile standalone binaries ──────────────────────
  compile-binaries:
    name: Compile Binaries
    needs: [release-gate, build-ajan-darwin]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-x86-64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Download darwin dist
        uses: actions/download-artifact@v8
        with:
          name: ajan-dist-darwin
          path: pkg/@eserstack/ajan/dist/

      - name: Build Go shared libraries (linux + windows)
        run: |
          deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts --target=aarch64-linux
          deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts --target=x86_64-linux
          deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts --target=x86_64-windows

      - name: Build Go WASM modules
        run: deno run --allow-all pkg/@eserstack/ajan/scripts/build.ts --wasm

      - name: Generate npm packages for ajan
        run: deno run --allow-all pkg/@eserstack/ajan/npm/generate-packages.ts

      - name: Compile for all platforms
        run: deno run --allow-all ./pkg/@eserstack/cli/scripts/compile.ts

      - name: Upload binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: binary-bundle
          path: etc/temp/binaries/

      - name: Upload ajan npm packages
        uses: actions/upload-artifact@v7
        with:
          name: ajan-npm-packages
          path: pkg/@eserstack/ajan/dist/npm/

  # ── Release: publish ajan npm packages ─────────────────────
  publish-ajan:
    name: Publish ajan packages
    # Same barrier as `publish`. compile-binaries alone does not depend on
    # either smoke test, so in the failed v4.3.0 run this job was publishing to
    # npm while smoke-test was already red.
    needs: [compile-binaries, smoke-test, npm-no-deno-test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download ajan npm packages
        uses: actions/download-artifact@v8
        with:
          name: ajan-npm-packages
          path: ajan-npm/

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # No `cache: "pnpm"` -- same reason as npm-no-deno-test: this job
      # publishes prebuilt directories from an artifact and never checks
      # out the repo, so there is no lockfile for the cache to key on.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          registry-url: "https://registry.npmjs.org"

      # Auth = npm OIDC trusted publishing (id-token:write + --provenance + the
      # setup-node registry-url above), EXACTLY like the main `publish` job. Do
      # NOT add `env: NODE_AUTH_TOKEN` — there is no NPM_TOKEN secret in this
      # project, and an empty token writes `_authToken=` into .npmrc, making pnpm
      # attempt (and fail) token auth (ENEEDAUTH) instead of using OIDC. Each
      # @eserstack/ajan-* package must have a trusted publisher configured on npm
      # (publisher: GitHub Actions, repo: eser/stack, workflow: build.yml). The
      # FIRST publish of a brand-new package name can't use OIDC (npm can't attach
      # a trusted publisher to a nonexistent package) — bootstrap it once via
      # .github/workflows/publish-ajan.yml, then this job self-sustains.
      #
      # A real publish error FAILS the job (only versions already on npm are
      # skipped) — the previous `|| echo "may already exist"` swallowed ENEEDAUTH
      # and published nothing while going green.
      - name: Publish ajan platform packages to npm
        run: |
          set -euo pipefail
          published=0
          skipped=0
          for dir in ajan-npm/ajan-*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✓ $name@$version already on npm — skipping"
              skipped=$((skipped + 1))
              continue
            fi
            echo "→ Publishing $name@$version ..."
            (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
            published=$((published + 1))
          done
          echo "Done: $published published, $skipped already-present."
          # No root @eserstack/ajan meta-package — the eser CLI lists
          # @eserstack/ajan-* as optionalDependencies directly.

  # ── Release: upload assets + sign ─────────────────────────────
  upload-assets:
    name: Upload & Sign Assets
    needs: [compile-binaries, release-notes]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download binary bundle
        uses: actions/download-artifact@v8
        with:
          name: binary-bundle
          path: binaries/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archives
        run: |
          cd binaries
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Upload to GitHub Release
        run: |
          VERSION=$(cat VERSION)
          TAG="v$VERSION"
          gh release upload "$TAG" --clobber \
            binaries/*.tar.gz \
            binaries/*.zip \
            binaries/*.bundle \
            binaries/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          VERSION=$(cat VERSION)
          echo "### Binary assets uploaded for v$VERSION" >> $GITHUB_STEP_SUMMARY
          ls -lh binaries/*.tar.gz binaries/*.zip 2>/dev/null | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done

  # ── Release: update Homebrew tap ──────────────────────────────
  update-homebrew:
    name: Update Homebrew Tap
    needs: upload-assets
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: 5
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ESER_APP_ID }}
          private-key: ${{ secrets.ESER_APP_PRIVATE_KEY }}
          owner: eser
          repositories: homebrew-tap

      - name: Update formula
        run: deno run --allow-all ./etc/scripts/update-homebrew-formula.ts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # ── Release: update Nix hashes ────────────────────────────────
  update-nix-hashes:
    name: Update Nix Hashes
    needs: upload-assets
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: 5
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            node_modules
          key: deno-${{ runner.arch }}-${{ hashFiles('deno.json', '**/deno.json', '**/package.json') }}
          restore-keys: deno-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ESER_APP_ID }}
          private-key: ${{ secrets.ESER_APP_PRIVATE_KEY }}
          owner: eser
          repositories: stack

      - name: Update hashes
        run: deno run --allow-all ./etc/scripts/update-nix-hashes.ts

      # Two trees, because the constraints pull opposite ways: the hashes have
      # to be computed from the TAG's tree (main's VERSION may already point
      # past this tag, and only the tagged release's archives exist to hash),
      # but the commit has to land on current main. A tag checkout is a detached
      # HEAD, so the old bare `git commit && git push` here could never succeed
      # -- and continue-on-error hid that, so nix hashes silently stopped
      # updating.
      #
      # continue-on-error STAYS on this job: a distribution follower must not
      # fail a release whose packages are already published. But it also means
      # the new failure modes here (main dropped nix/, a rebase conflict, branch
      # protection rejecting the push) would be just as silent, so the step
      # below ends with an explicit ::warning:: — visible in the run summary,
      # not just as a red square someone has to go looking for.
      #
      # fetch-depth 0: the rebase retry below has to replay onto whatever main
      # has become, and a shallow clone may lack the merge base.
      - name: Checkout main for the commit
        uses: actions/checkout@v7
        with:
          ref: main
          path: main-tree
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit hashes to main
        run: |
          set -euo pipefail
          # continue-on-error keeps a failure here from failing the release, so
          # announce it loudly instead of letting it pass as a green run.
          trap 'echo "::warning::Nix hash update failed — run this job again, or update nix/hashes.json by hand."' ERR

          # Read VERSION from the tag's tree before switching directories --
          # main-tree holds a different, possibly newer, VERSION file.
          VERSION=$(cat VERSION)

          cp nix/hashes.json main-tree/nix/hashes.json
          cd main-tree

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/hashes.json
          # Hashes unchanged (a re-run of the same tag) is success, not failure.
          git diff --cached --quiet && exit 0
          git commit -m "chore(nix): update binary hashes for v$VERSION"

          # Explicit refspec: the checkout may leave HEAD detached. One retry
          # covers a push that landed on main while the release was running.
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }
