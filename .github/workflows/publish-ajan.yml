# Standalone, manually-triggered publish of the @eserstack/ajan platform
# packages, DECOUPLED from the Integrity Pipeline's `validate` job.
#
# Why this exists: the main release flow gates the ajan platform publish behind
# `validate` (publish-ajan → compile-binaries → release-gate → validate). But
# `validate` runs `pnpm install --frozen-lockfile`, which fails whenever
# pkg/@eserstack/{ajan,cli}/package.json reference platform packages that aren't
# on npm yet — and pnpm can't lock packages that don't exist. That is a
# bootstrap deadlock: the release that would publish the packages can't run
# until they're already published.
#
# This workflow breaks the deadlock: it builds the ajan platform packages on
# demand, without `validate`, using `--no-frozen-lockfile`. It has two modes:
#
#   bootstrap (default) — build all platforms and upload the generated tarballs
#     as an artifact. Use this for the FIRST EVER publish of a package: npm (
#     unlike PyPI) cannot attach a trusted publisher to a package that does not
#     exist yet, so OIDC can't create it (it 404s). Download the artifact and
#     `npm publish` each package locally as the eserstack org owner. THEN add a
#     GitHub-Actions trusted publisher to each package (repo eser/stack, workflow
#     publish-ajan.yml) so future releases can go over OIDC token-lessly.
#
#   publish — build all platforms and publish via OIDC (--provenance, no token).
#     Use this once every target package exists AND has a trusted publisher
#     configured. Versions already on npm are skipped; a real error fails the job.
#
# Either way, after the platform packages are on npm, run
# `pnpm install --lockfile-only` and push so the lockfile gains their specifiers
# and the main pipeline's `validate` passes — the normal release flow then
# self-sustains.
#
# Platforms come from NATIVE_TARGETS (pkg/@eserstack/ajan/targets.ts):
# darwin-arm64, darwin-x64, linux-arm64, linux-x64, win32-x64, plus wasm.
# win32-arm64 is intentionally absent — Go has no `-buildmode=c-shared` for
# windows/arm64 (WASM covers that platform).

name: Publish ajan platform packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap = build + upload tarballs for manual first publish; publish = build + publish via OIDC (needs trusted publishing already configured)"
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - publish

permissions:
  contents: read

jobs:
  build-darwin:
    name: Build ajan (darwin)
    runs-on: macos-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # go.mod, not "stable": a new Go minor lands on the runner before the
          # pinned golangci-lint can parse it, and Validate then dies inside
          # staticcheck on the standard library rather than on our code.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build aarch64-darwin (native)
        run: make ajan-lib TARGET=aarch64-darwin

      - name: Build x86_64-darwin (cross-compile via clang -arch x86_64)
        run: make ajan-lib TARGET=x86_64-darwin

      - name: Upload darwin dist
        uses: actions/upload-artifact@v7
        with:
          name: ajan-dist-darwin
          path: |
            pkg/@eserstack/ajan/dist/aarch64-darwin/
            pkg/@eserstack/ajan/dist/x86_64-darwin/

  build-and-publish:
    name: Build (linux/windows/wasm) & publish
    needs: build-darwin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # No version: pnpm/action-setup reads packageManager from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # --no-frozen-lockfile is deliberate: the platform packages this workflow
      # publishes aren't on npm yet, so a frozen install would fail on their
      # unresolved optionalDependencies — the very deadlock this workflow breaks.
      - name: Install dependencies (no frozen — platform pkgs not yet published)
        run: pnpm install --no-frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # go.mod, not "stable": a new Go minor lands on the runner before the
          # pinned golangci-lint can parse it, and Validate then dies inside
          # staticcheck on the standard library rather than on our code.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-x86-64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Download darwin dist
        uses: actions/download-artifact@v8
        with:
          name: ajan-dist-darwin
          path: pkg/@eserstack/ajan/dist/

      - name: Build Go shared libraries (linux + windows)
        run: |
          make ajan-lib TARGET=aarch64-linux
          make ajan-lib TARGET=x86_64-linux
          make ajan-lib TARGET=x86_64-windows

      - name: Build Go WASM modules
        run: make ajan-wasm

      - name: Stage platform libraries into their packages
        run: make ajan-packages

      # The noskills binaries for the five targets, staged into the
      # @eserstack/noskills-<platform> packages the noskills launcher pins.
      - name: Compile and stage the noskills binaries
        run: |
          go run ./cmd/eser dev compile
          go run ./cmd/eser dev npm-binaries

      # ── bootstrap mode: upload the generated tarballs so they can be published
      # manually (npm login as the eserstack org owner). Needed for the FIRST
      # publish of any package, because npm can't pre-configure a trusted
      # publisher for a not-yet-existing package, so OIDC can't create it.
      # The artifact's least-common-ancestor is pkg/@eserstack/, so it extracts
      # to `ajan-<platform>/` dirs at the top level — ready for a publish loop.
      - name: Upload generated platform packages (manual first publish)
        if: inputs.mode == 'bootstrap'
        uses: actions/upload-artifact@v7
        with:
          name: ajan-npm-packages
          path: |
            pkg/@eserstack/ajan-*/package.json
            pkg/@eserstack/ajan-*/README.md
            pkg/@eserstack/ajan-*/libeser_ajan.*
            pkg/@eserstack/ajan-*/*.wasm
            pkg/@eserstack/noskills-*-*/package.json
            pkg/@eserstack/noskills-*-*/README.md
            pkg/@eserstack/noskills-*-*/noskills
            pkg/@eserstack/noskills-*-*/noskills.exe
          if-no-files-found: error

      # ── publish mode: publish each generated package whose exact version isn't
      # on npm yet. A real publish error FAILS the job (only already-published
      # versions are skipped) so silent publish failures can't hide again.
      #
      # Auth: this mirrors build.yml's `publish` job exactly — npm OIDC trusted
      # publishing (id-token:write + --provenance + setup-node registry-url),
      # NOT a token. There is no NPM_TOKEN secret in this project. Do NOT add
      # `env: NODE_AUTH_TOKEN` here: an empty token writes `_authToken=` into the
      # .npmrc, which makes pnpm attempt (and fail) token auth — ENEEDAUTH —
      # instead of falling back to OIDC. Requires each target package to already
      # exist AND have a trusted publisher configured (use bootstrap mode first).
      - name: Publish ajan platform packages to npm (OIDC)
        if: inputs.mode == 'publish'
        run: |
          set -euo pipefail
          published=0
          skipped=0
          for dir in pkg/@eserstack/ajan-*/ pkg/@eserstack/noskills-*-*/; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✓ $name@$version already on npm — skipping"
              skipped=$((skipped + 1))
              continue
            fi
            echo "→ Publishing $name@$version ..."
            (cd "$dir" && pnpm publish --provenance --access public --no-git-checks)
            published=$((published + 1))
          done
          echo "Done: $published published, $skipped already-present."
