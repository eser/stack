name: Update Contributors

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributors:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Go eser (cmd/eser, TASK-249); gh comes with the runner image.
      - name: Update contributor list
        run: go run ./cmd/eser codebase gh contributors --commit
        env:
          GH_TOKEN: ${{ github.token }}
